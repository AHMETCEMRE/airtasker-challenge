name: airtasker_challenge
version: '1.0.0'
config-version: 2

profile: airtasker_challenge

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

seeds:
  airtasker_challenge:
    # Scoped to raw_locations rather than applied to every seed: it stands in
    # for a source table the warehouse would normally load, so it belongs in
    # raw. category_weather_exposure is business configuration, not source
    # data, so it lands in the default schema alongside the models.
    raw_locations:
      +schema: raw

models:
  airtasker_challenge:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    mart:
      +materialized: table

vars:
  # Risk label boundaries, inclusive at the lower edge. Product tunes these
  # after launch, so they are configuration rather than code. Both marts read
  # the label through the weather_risk_label macro, so a change here can never
  # desynchronise Product's per-task warnings from Operations' daily counts.
  risk_threshold_medium: 30
  risk_threshold_high: 60

  # How long a job is assumed to occupy, starting at scheduled_at. A task is
  # scored against the worst weather in this window rather than a single hour.
  risk_window_hours: 3

  # "Now" for the eligibility filter. Defaults to the dbt run's start time;
  # override it to reproduce a past run, e.g.
  #   dbt build --vars '{risk_as_of_utc: "2026-11-20 00:00:00"}'
  risk_as_of_utc: ""
