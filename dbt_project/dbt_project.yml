name: airtasker_challenge
version: '1.0.0'
config-version: 2

profile: airtasker_challenge

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

seeds:
  airtasker_challenge:
    # Scoped to raw_locations rather than applied to every seed: it stands in
    # for a source table the warehouse would normally load, so it belongs in
    # raw. category_weather_exposure is business configuration, not source
    # data, so it lands in the default schema alongside the models.
    raw_locations:
      +schema: raw

models:
  airtasker_challenge:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    mart:
      +materialized: table
