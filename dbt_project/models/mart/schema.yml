version: 2

models:
  - name: fct_task_weather_risk
    description: >
      Product's mart. One row per task with upcoming scheduled work, carrying
      the weather risk score, the label, and enough of the underlying forecast
      to explain the verdict to a poster.

      A thin pass-through over int_task_weather_risk by design. If this model
      recomputed the label, it could drift from Operations' daily counts, which
      the brief says must never happen.
    columns:
      - name: task_id
        description: Grain of the table. One row per task.
        data_tests:
          - unique
          - not_null

      - name: title
        description: Task title, for the CRM message.

      - name: category
        description: Canonical category display name.
        data_tests:
          - not_null

      - name: city
        description: >
          City the task is in. NULL for a task whose location_id is not in the
          location seed.

      - name: country
        description: ISO 3166-1 alpha-2.

      - name: scheduled_at_local
        description: >
          When the work starts, in the location's own timezone - which is what
          a warning to the poster should quote, not UTC.

      - name: scheduled_local_date
        description: >
          Local calendar day the work falls on. The key Operations' mart joins
          on, so the two marts agree about which day a task belongs to.

      - name: weather_risk_score
        description: >
          0-100. NULL when no usable forecast covered the scheduled window.
        data_tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: weather_risk_label
        description: low, medium, high, or unknown when the score is NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high', 'unknown']

      - name: precip_probability_max
        description: Highest hourly chance of rain across the working window, percent.

      - name: precip_mm_sum
        description: Total rain across the working window, millimetres.

      - name: wind_gusts_kmh_max
        description: Strongest gust across the working window, km/h.

      - name: temperature_min_c
        description: Coldest hour of the working window, celsius.

      - name: temperature_max_c
        description: Warmest hour of the working window, celsius.

      - name: weather_code_modal
        description: Most frequent WMO weather code across the window.

      - name: precip_score
        description: Precipitation sub-score, 0-100, for explaining the verdict.

      - name: wind_score
        description: Wind sub-score, 0-100.

      - name: temp_score
        description: Temperature sub-score, 0-100.

      - name: hazard_score
        description: Worst of the three sub-scores, before category exposure is applied.

      - name: exposure_class
        description: Which exposure band the category sits in.

      - name: exposure_weight
        description: Multiplier applied to hazard_score to get weather_risk_score.

      - name: has_forecast
        description: >
          False when no forecast window matched - an orphaned location, refused
          coordinates, or a task scheduled past the usable horizon. Every such
          row is labelled 'unknown'.
        data_tests:
          - not_null

      - name: forecast_hours_covered
        description: Forecast hours available in the working window, out of risk_window_hours.

      - name: forecast_fetched_at_utc
        description: >
          When the forecast behind this score was fetched. Lets Product tell a
          stale warning from a fresh one.

      - name: is_valid_coordinates
        description: False where the location's coordinates were refused by ingestion.

      - name: location_id
        description: FK to stg_locations. Present even when the location is missing from the seed.

      - name: timezone_name
        description: IANA timezone used for the local conversion.

      - name: budget
        description: Task budget.

      - name: posted_at_utc
        description: When the task was posted, UTC.

      - name: assigned_at_utc
        description: When the task was assigned, UTC.

      - name: scheduled_at_utc
        description: When the work starts, UTC.

      - name: scheduled_hour_utc
        description: Scheduled start truncated to the hour; the forecast join key.

unit_tests: []
